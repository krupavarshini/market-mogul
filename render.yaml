services:
  - type: web
    name: market-mogul
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: market-mogul-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: market-mogul-db